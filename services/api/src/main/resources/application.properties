spring.application.name=roommate-marketplace-api
spring.jpa.open-in-view=false
spring.profiles.active=dev

rate-limit.enabled=true
rate-limit.policies.login.capacity=5
rate-limit.policies.login.refill-period=PT1M
rate-limit.policies.register.capacity=3
rate-limit.policies.register.refill-period=PT1H
rate-limit.policies.refresh.capacity=20
rate-limit.policies.refresh.refill-period=PT1M
rate-limit.policies.verification-email.capacity=3
rate-limit.policies.verification-email.refill-period=PT1H
rate-limit.policies.reports.capacity=5
rate-limit.policies.reports.refill-period=PT1H
rate-limit.policies.conversations.capacity=10
rate-limit.policies.conversations.refill-period=P1D
rate-limit.policies.messages.capacity=30
rate-limit.policies.messages.refill-period=PT1M
