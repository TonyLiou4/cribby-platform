spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/roommate_marketplace}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

email:
  verification:
    token-minutes: ${EMAIL_VERIFICATION_TOKEN_MINUTES:30}
  from: ${MAIL_FROM:no-reply@roommatemarketplace.local}
